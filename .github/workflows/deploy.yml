# Manual deployment to GitHub Pages. It never runs on push: publishing needs an explicit
# "Run workflow" click.
#
# Before the first run:
#   1. Create the repository and enable Pages with "GitHub Actions" as the source.
#   2. Set repository variables SITE_ORIGIN (https://<user>.github.io or your domain) and,
#      for a project site, SITE_BASE (for example /repository/).
# The production build refuses to run without a real HTTPS origin.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_ENV: production
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      SITE_BASE: ${{ vars.SITE_BASE || '/' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm check:output
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the built site to GitHub Pages
      id-token: write # let Pages verify that this workflow made the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
